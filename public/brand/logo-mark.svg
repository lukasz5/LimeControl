      <stop offset="0" stop-color="#4CAF2A"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>
    <radialGradient id="lc-knob" cx="104" cy="100" r="56" gradientUnits="userSpaceOnUse">
