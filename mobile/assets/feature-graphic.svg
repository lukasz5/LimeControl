<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500" fill="none">
  <title>LimeControl — survey control app</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14532D"/>
      <stop offset="1" stop-color="#0A2E18"/>
    </linearGradient>
    <linearGradient id="lime" x1="40" y1="200" x2="200" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5DBB2C"/>
      <stop offset="1" stop-color="#BEF264"/>
    </linearGradient>
    <radialGradient id="knob" cx="104" cy="100" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A8A4C"/>
      <stop offset="1" stop-color="#0F4024"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <!-- Znak: pokrętło z podziałką (jak w logo) -->
  <g transform="translate(92 82) scale(1.4)">
    <g stroke-linecap="round" stroke-width="5">
      <g stroke="#A3E635">
        <path d="M120 20v10" transform="rotate(-135 120 120)"/>
        <path d="M120 20v10" transform="rotate(-112.5 120 120)"/>
        <path d="M120 20v10" transform="rotate(-90 120 120)"/>
        <path d="M120 20v10" transform="rotate(-67.5 120 120)"/>
        <path d="M120 20v10" transform="rotate(-45 120 120)"/>
        <path d="M120 20v10" transform="rotate(-22.5 120 120)"/>
        <path d="M120 16v14"/>
        <path d="M120 20v10" transform="rotate(22.5 120 120)"/>
        <path d="M120 20v10" transform="rotate(45 120 120)"/>
      </g>
      <g stroke="#ECFDF5" stroke-opacity=".22">
        <path d="M120 20v10" transform="rotate(67.5 120 120)"/>
        <path d="M120 20v10" transform="rotate(90 120 120)"/>
        <path d="M120 20v10" transform="rotate(112.5 120 120)"/>
        <path d="M120 20v10" transform="rotate(135 120 120)"/>
