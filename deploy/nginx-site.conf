server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Behind Traefik: redirect /en -> /en/ with a relative Location (no internal port in the URL).
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

    # Match the original request so nginx can still serve index.html internally.
    if ($request_uri ~ "^/pytania-json(?:/index\.html|/demo(?:/index\.html|/)?)?(?:$|\?)") {
        return 301 /pytania-json/$is_args$args;
    }
    if ($request_uri ~ "^/pytania-json/(?:en(?:/index\.html)?|demo/en(?:/index\.html|/)?)(?:$|\?)") {
        return 301 /pytania-json/en/$is_args$args;
    }

    location = /sitemap.xml {
        types { application/xml xml; }
        # Keep a missing sitemap from returning the HTML error page.
        error_page 404 = @missing_sitemap;
        try_files $uri =404;
    }

    location @missing_sitemap {
        default_type text/plain;
        return 404 "Sitemap not found\n";
    }

    # /docs -> docs.html, /szablony -> szablony.html, /en -> /en/ (English pages)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.zip$ {
        add_header Content-Disposition attachment;
        add_header X-Content-Type-Options nosniff always;
    }

    # LimeSurvey survey structure files (survey templates): XML, offered as a download.
    location ~* \.lss$ {
        types { application/xml lss; }
        add_header Content-Disposition attachment;
        add_header X-Content-Type-Options nosniff always;
    }

    error_page 404 /index.html;
}
