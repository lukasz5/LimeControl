name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types, tests, builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      # The Docker image installs from bun.lock, so the lockfile must match package.json.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      # No Firebase configuration in CI: build the self-hosted flavour of the app.
      - name: Build the app
        run: npm run build
        env:
          VITE_AUTH_MODE: local

      - name: Build themes, templates and the website
        run: npm run build:site

      - name: Check website links, anchors and language versions
        run: npm run check:site

      # The .lss files and their catalogue are generated by pure Node code, so the committed copies
      # must be byte-identical. ZIP archives depend on the system `zip`, so other drift is only reported.
      - name: Survey templates are up to date
        run: |
          if ! git diff --quiet -- public/szablony-ankiet; then
            echo "::error::public/szablony-ankiet is out of date — run 'npm run build:site' and commit the result."
            git diff --stat -- public/szablony-ankiet
            exit 1
          fi
          if ! git diff --quiet -- site; then
            echo "::notice::Generated files in site/ differ from the committed ones (expected for ZIP archives built on another system):"
            git diff --stat -- site | tail -n 20
          fi

  mobile:
    name: Mobile app (web bundle, Android build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      # The Android Gradle build needs JDK 21 (newer JDKs fail with "Unsupported class file major version").
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same steps as `npm run build:mobile`, but syncing only the Android project (no Xcode on Linux).
      - name: Build the mobile web bundle
        run: |
          node mobile/scripts/sync-version.mjs
          npx vite build
          npx cap sync android
        env:
          VITE_PLATFORM: native

      - name: Native projects carry the version from package.json
        run: |
          if ! git diff --quiet -- mobile/ios/App/App.xcodeproj/project.pbxproj mobile/android/app/build.gradle; then
            echo "::error::Native project versions differ from package.json — run 'npm run build:mobile' and commit the result."
            git diff --stat -- mobile/ios/App/App.xcodeproj/project.pbxproj mobile/android/app/build.gradle
            exit 1
          fi

      # The store listings promise an app without accounts, tracking or remote resources.
      - name: Mobile bundle has no Firebase, service worker or remote fonts
        run: |
          set -euo pipefail
          test -f dist-mobile/index.html
          if grep -rlE "identitytoolkit|firestore\.googleapis|firebaseapp\.com" dist-mobile; then
            echo "::error::The mobile bundle contains Firebase code."; exit 1
          fi
          if grep -q "fonts.googleapis.com" dist-mobile/index.html; then
            echo "::error::The mobile bundle loads fonts from the internet."; exit 1
          fi
          if ls dist-mobile/sw.js dist-mobile/manifest.webmanifest 2>/dev/null; then
            echo "::error::The mobile bundle contains PWA files."; exit 1
          fi

      - name: Build the Android debug app
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the self-hosted app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: limecontrol-app:ci
          build-args: |
            VITE_AUTH_MODE=local
          cache-from: type=gha,scope=app-selfhost
          cache-to: type=gha,mode=max,scope=app-selfhost

      - name: Build the website image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/site.Dockerfile
          load: true
          tags: limecontrol-site:ci
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site

      - name: Smoke-test the images
        env:
          # A throwaway key that exists only for this job.
          CI_ACCESS_KEY: ci-access-key-0123456789abcdef
        run: |
          set -euo pipefail
          docker run -d --name app -p 18080:8080 -e AUTH_MODE=local -e LIMECONTROL_ACCESS_KEY="$CI_ACCESS_KEY" limecontrol-app:ci
          docker run -d --name site -p 18081:8080 limecontrol-site:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          APP=http://127.0.0.1:18080
          SITE=http://127.0.0.1:18081
          # Download first, then search: `curl | grep -q` fails under pipefail when grep exits early.
          has() { local body; body="$(curl -fsS "${@:2}")"; grep -q -- "$1" <<<"$body"; }

          curl -fsS "$APP/api/health"
          has '"authMode":"local"' "$APP/api/config"
          has '<div id="root"' "$APP/"
          has '"templates"' "$APP/szablony-ankiet/catalog.json"

          # The API is closed without the access key and open with it.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$APP/api/schedules")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CI_ACCESS_KEY" "$APP/api/schedules")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"endpoint":"http://127.0.0.1/","method":"get_session_key"}' "$APP/api/rpc-relay")" = 401

          has '<html lang="pl"' "$SITE/"
          has '<html lang="en"' "$SITE/en/"
          has 'id="strefaankiet"' "$SITE/en/docs"
          headers="$(curl -fsSI "$SITE/ankiety/pobierz/nps-klienta.lss")"
          grep -qi 'content-disposition: attachment' <<<"$headers"

          docker logs app | tail -n 20
          docker rm -f app site
