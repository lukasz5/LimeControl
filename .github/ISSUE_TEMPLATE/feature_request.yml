name: Feature request / Propozycja
description: Suggest an idea, a survey template or a theme (English or Polish).
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - App (PWA)
        - Survey themes
        - Survey templates
        - Deployment
        - Website / documentation
        - CATI / CAPI
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation in your own work — who needs it and when.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
